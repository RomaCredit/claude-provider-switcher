name: Publish to PyPI

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: python -m unittest discover -s tests -v
        env:
          CCS_TEST_NATIVE_KEYCHAIN: ${{ runner.os == 'macOS' && '1' || '0' }}
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/claude-provider-switcher
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check tag and build
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python -c 'import os; from claude_provider_switcher import __version__; assert os.environ["RELEASE_TAG"] == "v" + __version__'
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-distributions
          path: dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
