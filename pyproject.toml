[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-provider-switcher"
version = "0.1.5"
description = "Switch Claude Code API profiles with private credentials, settings backups, and history diagnostics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "RomaCredit"}]
dependencies = []
keywords = ["claude-code", "anthropic", "anthropic-compatible", "provider-switcher", "llm-gateway", "conversation-history", "cli"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]

[project.scripts]
ccs = "claude_provider_switcher.cli:main"
claude-provider-switcher = "claude_provider_switcher.cli:main"

[project.urls]
Homepage = "https://github.com/RomaCredit/claude-provider-switcher"
Repository = "https://github.com/RomaCredit/claude-provider-switcher"
Documentation = "https://github.com/RomaCredit/claude-provider-switcher#readme"
Changelog = "https://github.com/RomaCredit/claude-provider-switcher/blob/main/CHANGELOG.md"
Issues = "https://github.com/RomaCredit/claude-provider-switcher/issues"

[tool.setuptools.packages.find]
include = ["claude_provider_switcher*"]
